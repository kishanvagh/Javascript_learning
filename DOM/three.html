<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

    <body style="background-color: #212121; color: #fff;">


    </body>
    <script>
      const div = document.createElement('div')    //this will not show in browser screen because it is just created in memory not appended in dom
      console.log(div)
       div.className = "main"
       div.id = Math.round(Math.random() * 10 + 1)
        div.setAttribute("title", "generated title")   //(attribute,value)
         div.style.backgroundColor = "green"
       div.style.padding = "12px"
       div.innerText = "Chai aur code"
       document.body.appendChild(div)    //after this out div will be visible on the browser screen
    </script>
</html>
