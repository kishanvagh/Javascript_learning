<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guessing Game</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
        background-color: #2e2e2e;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .game-card {
        width: 380px;
        background-color: #3a3a3a;
        padding: 30px 25px;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        text-align: center;
        color: #fff;
    }

    .game-card h1 {
        font-size: 20px;
        margin-bottom: 10px;
        font-weight: bold;
    }

    .game-card p {
        font-size: 14px;
        color: #dcdcdc;
        margin-bottom: 6px;
    }

    .title {
        font-size: 42px;
        font-weight: 300;
        margin: 30px 0 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        font-size: 18px;
        border-radius: 4px;
        border: none;
        outline: none;
        margin-bottom: 20px;
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #111;
        color: #fff;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-bottom: 20px;
    }

    button:hover {
        background-color: #000;
    }

    .info {
        font-size: 14px;
        color: #eee;
    }

    .info span {
        display: inline-block;
        background-color: #777;
        padding: 2px 6px;
        border-radius: 3px;
        margin-left: 5px;
        font-size: 13px;
    }

    .remaining {
        margin-top: 8px;
    }
</style>
</head>

<body>

    <div class="game-card">
        <h1>Number guessing game</h1>
        <p>Try and guess a random number between 1 and 100.</p>
        <p>You have 10 attempts to guess the right number.</p>

        <div class="title">Guess a number</div>

        <input type="number" id='numberField' placeholder="Enter your guess">

        <button id="btnField">Submit guess</button>
        <div id="result"></div>
        <div class="info">
            Previous Guesses: <span id="prevGuess"></span>
        </div>

        <div class="info remaining">
            Guesses Remaining: <strong id="remGuess">10</strong>
        </div>
    </div>

</body>
<script src="four.js"></script>
</html>
