<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator UI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background-color: #fff;
            width: 360px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #4CAF50;
            color: #fff;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #43a047;
        }

        .info {
            margin-top: 20px;
            font-size: 14px;
            color: #444;
        }

        .formula {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .ranges {
            margin-top: 15px;
            background-color: #f0f0f0;
            padding: 10px;
            border-radius: 6px;
        }

        .ranges p {
            margin: 4px 0;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>BMI Calculator</h1>

        <div class="field">
            <label>Weight (kg)</label>
            <input type="number" id="weight" placeholder="Enter your weight">
        </div>

        <div class="field">
            <label>Height (cm)</label>
            <input type="number" id="height" placeholder="Enter your height">
        </div>

        <button>Calculate BMI</button>
        <div id="result"></div>
        <div class="info">
            <strong>How BMI is calculated:</strong>
            <div class="formula">
                BMI = Weight (kg) ÷ (Height (m) × Height (m))
            </div>

            <div class="ranges">
                <strong>BMI Ranges:</strong>
                <p>Underweight: Less than 18.5</p>
                <p>Normal: 18.5 – 24.9</p>
                <p>Overweight: 25 – 29.9</p>
                <p>Obese: 30 or more</p>
            </div>
        </div>
    </div>

</body>
<script src="second.js"></script>
</html>
