<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock UI</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        height: 100vh;
        background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .clock-wrapper {
        background: linear-gradient(145deg, #0a0a0a, #1c1c1c);
        padding: 20px 30px;
        border-radius: 12px;
        box-shadow:
            0 0 20px rgba(0, 255, 255, 0.4),
            inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .clock {
        color: #00fff0;
        font-size: 48px;
        letter-spacing: 4px;
        text-shadow:
            0 0 5px #00fff0,
            0 0 10px #00fff0,
            0 0 20px #00fff0;
    }

    .label {
        text-align: center;
        margin-top: 8px;
        font-size: 12px;
        color: #aaa;
        letter-spacing: 2px;
    }
</style>
</head>

<body>

    <div class="clock-wrapper">
        <div class="clock"></div>
        <div class="label">DIGITAL CLOCK</div>
    </div>

</body>
<script src="third.js"></script>
</html>
